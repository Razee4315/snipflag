name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'site/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also check macOS and Linux (only when the owner asks for all platforms)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        # Windows only by default; pushes never build the other platforms.
        os: ${{ fromJSON(inputs.all_platforms && '["windows-latest","macos-latest","ubuntu-24.04"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libdrm-dev libclang-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: npm run tauri -- icon public/icon.svg
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
