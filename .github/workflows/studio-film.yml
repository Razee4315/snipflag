name: Studio launch film
on:
  push:
    branches: [codex/launch-film]
    paths: ['video/studio/**', '.github/workflows/studio-film.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg python3-numpy
      - name: Inspect source recording
        run: |
          mkdir -p video/studio/out
          ffprobe -v quiet -show_format -show_streams -of json site/assets/video/demo.mp4 > video/studio/out/source.json
          ffmpeg -i site/assets/video/demo.mp4 -vf "fps=1/3,scale=480:-1,tile=4x4" -frames:v 1 video/studio/out/source-contact.jpg
      - name: Prepare renderer and source edit
        working-directory: video/studio
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o font.ttf
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt' -o out/Manrope-OFL.txt
          mkdir footage
          ffmpeg -hide_banner -loglevel error -i ../../site/assets/video/demo.mp4 -filter_complex "[0:v]split=4[a][b][c][d];[a]trim=start=0:end=6,setpts=(PTS-STARTPTS)/1.5[a1];[b]trim=start=9:end=16,setpts=(PTS-STARTPTS)/1.75[b1];[c]trim=start=18:end=22,setpts=(PTS-STARTPTS)/2[c1];[d]trim=start=26:end=30,setpts=(PTS-STARTPTS)/2[d1];[a1][b1][c1][d1]concat=n=4:v=1:a=0,fps=30[out]" -map "[out]" -frames:v 360 -q:v 2 footage/%05d.jpg
          python3 score.py
          node --check film.js
          node --check render.mjs
      - name: Render visual proofs
        working-directory: video/studio
        run: node render.mjs --proof
      - uses: actions/upload-artifact@v4
        with:
          name: studio-visual-proofs
          path: video/studio/out/frame-*.png
          retention-days: 14
      - name: Render and verify 1080p60 master
        working-directory: video/studio
        run: node render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snipflag-studio-film
          path: |
            video/studio/out/Snipflag-*.mp4
            video/studio/out/poster.png
            video/studio/out/contact-sheet.jpg
            video/studio/out/verification.json
            video/studio/out/source-contact.jpg
            video/studio/out/source.json
            video/studio/out/Manrope-OFL.txt
          retention-days: 14
