name: Feature request
description: Suggest an improvement to Snipflag.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Snipflag aims to stay small and focused. Please check the non-goals in docs/PRODUCT.md before suggesting a new capability.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - All
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested.
          required: true
